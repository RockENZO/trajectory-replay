[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajectory-replay"
version = "0.1.0"
description = "Deterministic replay and trajectory regression tests for tool-using LLM agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_replay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
