[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajectory-replay"
version = "0.1.0"
description = "Deterministic replay and trajectory regression tests for tool-using LLM agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "agents", "tool-use", "testing", "regression", "replay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/RockENZO/trajectory-replay"
Repository = "https://github.com/RockENZO/trajectory-replay"
Issues = "https://github.com/RockENZO/trajectory-replay/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.2,<2"]
agents = ["openai-agents>=0.24.0"]
agentframework = ["agent-framework-core>=1.24.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_replay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
